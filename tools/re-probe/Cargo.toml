[package]
name = "re-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Research helper for writing profiles: which code writes or reads an address, disassembly, hex dumps"

# Separate workspace: a developer tool, not part of the app.
[workspace]

[dependencies]
memchr = "2"
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
