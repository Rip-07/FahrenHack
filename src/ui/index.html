<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060c15">
<title>FahrenHack</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="bg" aria-hidden="true"><div id="bg-img"></div><div id="bg-tint"></div><div id="bg-shade"></div><div id="bg-grid"></div></div>
<div id="app">
  <header id="top">
    <div class="brand"><img src="/logo.svg" alt=""><span>Fahren<b>Hack</b></span></div>
    <nav id="tabs" aria-label="Разделы">
      <span class="tabhint pad-only">LB</span>
      <button data-view="home"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="5"/><path d="M8 10.5v4M6 12.5h4M15.5 12h.01M18 14h.01"/></svg><span>Игры</span></button>
      <button data-view="scanner"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><span>Сканер</span></button>
      <button data-view="remote"><svg class="ic" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><span>Пульт</span></button>
      <button data-view="settings"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 7l2.6 1.5M17.2 15.5l2.6 1.5M4.2 17l2.6-1.5M17.2 8.5 19.8 7"/></svg><span>Настройки</span></button>
      <span class="tabhint pad-only">RB</span>
    </nav>
    <div class="status">
      <a class="kofi" href="https://ko-fi.com/fahrentech" target="_blank" rel="noopener" data-act="kofi" data-k="kofi" title="Поддержать FahrenHack на Ko-fi"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 4v2M12 3v3"/></svg><span>Ko-fi</span></a>
      <div id="gchip" class="gchip"><span class="dot"></span><span class="t">Нет игры</span></div>
      <div id="clock"></div>
      <div class="winctl">
        <button data-win="min" tabindex="-1" title="Свернуть"><svg viewBox="0 0 12 12"><path d="M1.5 6h9"/></svg></button>
        <button data-win="max" tabindex="-1" title="Развернуть"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5"/></svg></button>
        <button data-win="close" tabindex="-1" class="x" title="Закрыть"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
      </div>
    </div>
  </header>
  <main id="view"></main>
  <footer id="hints"></footer>
</div>
<div id="modal" class="hide" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
