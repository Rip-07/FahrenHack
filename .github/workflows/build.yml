name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash target/release/fahrenhack.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  fahrenhack.exe" | Out-File -Encoding ascii target/release/fahrenhack.exe.sha256
          Get-Content target/release/fahrenhack.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fahrenhack-windows-x64
          path: |
            target/release/fahrenhack.exe
            target/release/fahrenhack.exe.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/fahrenhack.exe
            target/release/fahrenhack.exe.sha256
